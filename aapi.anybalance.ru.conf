server {
    server_name aapi.anybalance.ru;

    location / {
        include proxy_params;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header CF-Connecting-IP $remote_addr;

        proxy_http_version 1.1;

	proxy_pass http://192.168.1.250:3009/;
    }

    # /opt/share/acme.sh/acme.sh --issue --dns dns_cf -d aapi.anybalance.ru --config-home /opt/share/acme.sh --reloadcmd "/opt/sbin/nginx -s reload"
    listen 0.0.0.0:6443 ssl;
    ssl_certificate /opt/share/acme.sh/aapi.anybalance.ru_ecc/fullchain.cer; 
    ssl_certificate_key /opt/share/acme.sh/aapi.anybalance.ru_ecc/aapi.anybalance.ru.key; 
}

server {
    if ($host = aapi.anybalance.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 0.0.0.0:680;
    server_name aapi.anybalance.ru;
    return 404; # managed by Certbot
}